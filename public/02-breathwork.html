<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CIELO Breathwork</title>
<link rel="stylesheet" href="assets/form-kit.css">
</head>
<body>

<div class="shell">

  <div class="topbar">
    <span class="brandmark">CLOO</span>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="form-wrap">

    <header class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p data-i18n="intro"></p>
      <span class="event-badge"></span>
    </header>

    <div class="form-err" role="alert"></div>

    <form class="card" novalidate>

      <div class="hp" aria-hidden="true">
        <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <div class="field">
        <label class="label" for="nombre"><span data-i18n="f_name"></span><span class="req">*</span></label>
        <input type="text" id="nombre" name="nombre" data-req autocomplete="name" data-i18n-ph="ph_name">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="email"><span data-i18n="f_email"></span><span class="req">*</span></label>
        <input type="email" id="email" name="email" data-req autocomplete="email" inputmode="email"
               autocapitalize="off" spellcheck="false" data-i18n-ph="ph_email">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="telefono"><span data-i18n="f_phone"></span><span class="req">*</span></label>
        <input type="tel" id="telefono" name="telefono" data-req autocomplete="tel" inputmode="tel"
               data-i18n-ph="ph_phone">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_who"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="destinatario" data-req>
          <button type="button" class="chip" data-value="personal" aria-pressed="false" data-i18n="who_me"></button>
          <button type="button" class="chip" data-value="empresa"  aria-pressed="false" data-i18n="who_company"></button>
          <button type="button" class="chip" data-value="grupo"    aria-pressed="false" data-i18n="who_group"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field" data-show-when="destinatario=empresa">
        <label class="label" for="empresa"><span data-i18n="f_company"></span></label>
        <input type="text" id="empresa" name="empresa" autocomplete="organization" data-i18n-ph="ph_optional">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_goal"></span><span class="req">*</span>
          <span class="hint" data-i18n="f_goal_hint"></span>
        </label>
        <div class="chips stack" data-name="objetivo" data-req>
          <button type="button" class="chip" data-value="burnout" aria-pressed="false" data-i18n="gl_burnout"></button>
          <button type="button" class="chip" data-value="anxiety" aria-pressed="false" data-i18n="gl_anxiety"></button>
          <button type="button" class="chip" data-value="energy"  aria-pressed="false" data-i18n="gl_energy"></button>
          <button type="button" class="chip" data-value="sleep"   aria-pressed="false" data-i18n="gl_sleep"></button>
          <button type="button" class="chip" data-value="grief"   aria-pressed="false" data-i18n="gl_grief"></button>
          <button type="button" class="chip" data-value="growth"  aria-pressed="false" data-i18n="gl_growth"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_experience"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="experiencia" data-req>
          <button type="button" class="chip" data-value="never"   aria-pressed="false" data-i18n="ex_never"></button>
          <button type="button" class="chip" data-value="some"    aria-pressed="false" data-i18n="ex_some"></button>
          <button type="button" class="chip" data-value="regular" aria-pressed="false" data-i18n="ex_regular"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_format"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="modalidad" data-req>
          <button type="button" class="chip" data-value="individual" aria-pressed="false" data-i18n="fm_individual"></button>
          <button type="button" class="chip" data-value="group"      aria-pressed="false" data-i18n="fm_group"></button>
          <button type="button" class="chip" data-value="program"    aria-pressed="false" data-i18n="fm_program"></button>
          <button type="button" class="chip" data-value="corporate"  aria-pressed="false" data-i18n="fm_corporate"></button>
          <button type="button" class="chip" data-value="unsure"     aria-pressed="false" data-i18n="fm_unsure"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_when"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="cuando" data-req>
          <button type="button" class="chip" data-value="now"       aria-pressed="false" data-i18n="when_now"></button>
          <button type="button" class="chip" data-value="month"     aria-pressed="false" data-i18n="when_month"></button>
          <button type="button" class="chip" data-value="quarter"   aria-pressed="false" data-i18n="when_quarter"></button>
          <button type="button" class="chip" data-value="exploring" aria-pressed="false" data-i18n="when_exploring"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_contact_pref"></span></label>
        <div class="chips" data-name="preferencia_contacto">
          <button type="button" class="chip" data-value="whatsapp" aria-pressed="false" data-i18n="cp_whatsapp"></button>
          <button type="button" class="chip" data-value="call"     aria-pressed="false" data-i18n="cp_call"></button>
          <button type="button" class="chip" data-value="email"    aria-pressed="false" data-i18n="cp_email"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="nota"><span data-i18n="f_note"></span></label>
        <textarea id="nota" name="nota" data-i18n-ph="ph_note_health"></textarea>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="consent">
          <input type="checkbox" name="consentimiento" data-req>
          <span data-i18n="consent"></span>
        </label>
        <span class="field-err"></span>
      </div>

      <div class="actions">
        <button type="submit" class="submit" data-i18n="submit"></button>
        <p class="legal" data-i18n="legal"></p>
      </div>

    </form>
  </div>

  <div class="done">
    <div class="mark"></div>
    <h2 data-i18n="done_title"></h2>
    <p data-i18n="done_text"></p>
    <div class="queued" data-i18n="queued"></div>
    <button type="button" class="again" data-i18n="again"></button>
  </div>

  <footer>CLOO · CIELO Breathwork</footer>
</div>

<script>
window.FORM_CONFIG = {
  formId: 'breathwork',
  servicio: 'breathwork',
  linea: 'B2C',
  defaultLang: 'es',
  i18n: {

      page_title: 'CIELO Breathwork',

      f_who: '¿Para quién es?',
      who_me: 'Para mí',
      who_company: 'Para mi equipo o empresa',
      who_group: 'Para un grupo o retiro privado',

      f_goal: '¿Qué te gustaría trabajar?',
      f_goal_hint: 'Elige lo que más pesa hoy.',
      gl_burnout: 'Estrés y agotamiento',
      gl_anxiety: 'Ansiedad y mente acelerada',
      gl_energy: 'Energía y claridad',
      gl_sleep: 'Sueño y descanso',
      gl_grief: 'Un duelo o proceso emocional',
      gl_growth: 'Crecimiento personal',

      f_experience: '¿Has hecho breathwork antes?',
      ex_never: 'Nunca, sería mi primera vez',
      ex_some: 'Alguna vez',
      ex_regular: 'Lo practico con regularidad',

      f_format: '¿Qué formato te interesa?',
      fm_individual: 'Sesión individual',
      fm_group: 'Sesión grupal',
      fm_program: 'Programa de 12 semanas',
      fm_corporate: 'Sesión para mi empresa',
      fm_unsure: 'No sé, quiero orientación',

      ph_note_health: 'Opcional. Alguna condición de salud, embarazo o algo que debamos cuidar.',

      done_text: 'Recibido. Te escribimos en las próximas 48 horas para orientarte sobre el formato que mejor te sirve.'
    },
    en: {
      page_title: 'CIELO Breathwork',
      eyebrow: 'CIELO Breathwork',
      title: 'Breathe differently',
      intro: 'Conscious breathing sessions to turn down the noise, release stress and come back to yourself. Leave your details and we will tell you which format fits you.',

      f_who: 'Who is this for?',

      f_goal: 'What would you like to work on?',

      f_experience: 'Have you done breathwork before?',
      ex_never: 'Never, it would be my first time',

      f_format: 'Which format interests you?',
      fm_individual: 'One-on-one session',
      fm_group: 'Group session',
      fm_program: '12-week program',
      fm_corporate: 'Session for my company',
      fm_unsure: 'Not sure, I want guidance',

      ph_note_health: 'Optional. Any health condition, pregnancy or anything we should look after.',

      done_text: 'Received. We will write to you within 48 hours to help you find the format that fits best.'
    }
  }
};
</script>
<script src="assets/form-kit.js"></script>
</body>
</html>

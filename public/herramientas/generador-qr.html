<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLOO · Generador de QR</title>
<style>
  :root{
    --ground:#FBF7F3; --surface:#FFFFFF; --ink:#251629; --ink-2:#6B5C74; --ink-3:#9A8CA1;
    --brand:#4A1E6E; --brand-soft:#F2E9F7; --gold:#FFB020; --gold-ink:#8F5B00; --gold-soft:#FDF3E0;
    --line:#E7DDE9; --line-2:#D6C7DA;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 22px 70px;}

  header{padding:40px 0 22px;border-bottom:2px solid var(--ink);margin-bottom:26px;}
  .brandmark{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
             color:var(--gold-ink);font-weight:600;}
  h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:600;margin:12px 0 0;}
  header p{color:var(--ink-2);margin:10px 0 0;max-width:64ch;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;
         padding:22px;margin-bottom:26px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} }

  label{display:block;font-weight:600;font-size:14px;margin:0 0 7px;}
  label small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px;}
  input[type=text]{width:100%;min-height:48px;padding:12px 14px;font-family:inherit;font-size:15px;
    border:1.5px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--ink);}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}

  .aviso{background:var(--gold-soft);border:1px solid var(--gold);border-left:4px solid var(--gold);
         border-radius:9px;padding:12px 15px;font-size:13.5px;color:var(--gold-ink);margin-top:16px;}

  .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  button{appearance:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;
    padding:13px 22px;min-height:48px;border-radius:9px;border:0;background:var(--brand);color:#fff;}
  button:hover{opacity:.9;}
  button.sec{background:transparent;color:var(--brand);border:1.5px solid var(--brand);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:12px;
           padding:20px;text-align:center;}
  .tarjeta h3{font-family:var(--serif);font-size:17px;margin:0 0 4px;}
  .tarjeta .serv{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
                 color:var(--gold-ink);margin-bottom:14px;}
  .tarjeta canvas{width:100%;max-width:190px;height:auto;image-rendering:pixelated;
                  border:1px solid var(--line);border-radius:8px;background:#fff;}
  .tarjeta .url{font-family:var(--mono);font-size:10px;color:var(--ink-3);word-break:break-all;
                margin:12px 0 0;line-height:1.4;}
  .tarjeta button{margin-top:12px;padding:9px 16px;min-height:40px;font-size:13px;}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-2);
         font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--ink-3);text-align:center;}

  @media print{
    body{background:#fff;}
    .panel,.acciones,header p,footer{display:none;}
    .tarjetas{grid-template-columns:repeat(2,1fr);gap:26px;}
    .tarjeta{break-inside:avoid;border:1px solid #999;}
    .tarjeta button{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="brandmark">CLOO</span>
    <h1>Generador de QR</h1>
    <p>Un QR por servicio y por evento. El nombre del evento viaja dentro del código, así que
       después se puede saber de qué networking salió cada lead sin preguntárselo a nadie.</p>
  </header>

  <div class="panel">
    <div class="grid">
      <div>
        <label for="base">Dirección donde están los formularios
          <small>Sin barra final. Se completa sola con el nombre de cada archivo.</small>
        </label>
        <input type="text" id="base" placeholder="https://forms.cloolouisville.com"
               value="https://forms.cloolouisville.com">
      </div>
      <div>
        <label for="evento">Nombre del evento
          <small>Minúsculas y guiones, sin acentos ni espacios.</small>
        </label>
        <input type="text" id="evento" placeholder="expo-bodas-miami-oct">
      </div>
    </div>

    <div class="aviso" id="aviso" hidden></div>

    <div class="acciones">
      <button id="generar">Generar los cuatro QR</button>
      <button id="imprimir" class="sec">Imprimir hoja</button>
      <button id="descargar" class="sec">Descargar los cuatro en una hoja</button>
    </div>
  </div>

  <div class="tarjetas" id="tarjetas"></div>

  <footer>CLOO · Cielo Stein</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  var SERVICIOS = [
    { archivo: 'entertainment',    nombre: 'CIELO Entertainment', clave: 'entertainment' },
    { archivo: 'breathwork',       nombre: 'CIELO Breathwork',    clave: 'breathwork' },
    { archivo: 'latin-dance',      nombre: 'CLOO Latin Dance',    clave: 'latin-dance' },
    { archivo: 'performance',      nombre: 'CLOO Performance',    clave: 'performance' }
  ];

  var $ = function (s) { return document.querySelector(s); };
  var aviso = $('#aviso');

  function decir(texto) {
    if (!texto) { aviso.hidden = true; return; }
    aviso.textContent = texto;
    aviso.hidden = false;
  }

  /* El nombre del evento acaba en la URL y agrupa los leads en el CRM:
     si viene con acentos, mayúsculas o espacios, dos eventos que son el
     mismo acabarían contando por separado. */
  function limpiarEvento(v) {
    return v.toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  /* Se queda solo con el dominio y descarta cualquier ruta pegada por error.
     Si alguien copia aqui la direccion de un formulario ya abierto
     (.../performance) en vez del dominio, sin esto los QR salen apuntando a
     /performance/entertainment y al escanearlos dan "no encontrado". */
  function limpiarBase(v) {
    v = (v || '').trim();
    if (!v) { return ''; }
    if (!/^https?:\/\//i.test(v)) { v = 'https://' + v; }
    try {
      return new URL(v).origin;
    } catch (e) {
      return v.replace(/\/+$/, '');
    }
  }

  function urlDe(base, archivo, evento) {
    var u = base.replace(/\/+$/, '') + '/' + archivo;
    return evento ? u + '?evento=' + encodeURIComponent(evento) : u;
  }

  function generar() {
    var crudo = $('#base').value;
    var base = limpiarBase(crudo);
    var evento = limpiarEvento($('#evento').value);

    if (base && base !== crudo.trim().replace(/\/+$/, '')) {
      $('#base').value = base;
    }

    if (!base) { decir('Falta la dirección donde están los formularios.'); return; }
    if (!/^https?:\/\//i.test(base)) { decir('La dirección debe empezar por https://'); return; }
    if (!/^https:/i.test(base)) {
      decir('Aviso: sin HTTPS, los móviles muestran una advertencia antes de abrir el formulario.');
    } else if (!evento) {
      decir('Sin nombre de evento los QR funcionan, pero los leads quedan sin saber de qué networking salieron.');
    } else {
      decir('');
    }

    if (evento && evento !== $('#evento').value.trim()) $('#evento').value = evento;

    var cont = $('#tarjetas');
    cont.innerHTML = '';

    SERVICIOS.forEach(function (s) {
      var url = urlDe(base, s.archivo, evento);

      var tarjeta = document.createElement('div');
      tarjeta.className = 'tarjeta';

      var h3 = document.createElement('h3');
      h3.textContent = s.nombre;
      var serv = document.createElement('div');
      serv.className = 'serv';
      serv.textContent = evento || 'sin evento';

      var caja = document.createElement('div');

      var pUrl = document.createElement('p');
      pUrl.className = 'url';
      pUrl.textContent = url;

      var boton = document.createElement('button');
      boton.className = 'sec';
      boton.textContent = 'Descargar PNG';

      tarjeta.appendChild(h3);
      tarjeta.appendChild(serv);
      tarjeta.appendChild(caja);
      tarjeta.appendChild(pUrl);
      tarjeta.appendChild(boton);
      cont.appendChild(tarjeta);

      // Corrección alta: un QR impreso se arruga, se moja y se lee de lejos.
      new QRCode(caja, {
        text: url, width: 460, height: 460,
        colorDark: '#251629', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      boton.addEventListener('click', function () {
        var lienzo = caja.querySelector('canvas');
        if (!lienzo) return;
        descargar(lienzo, 'qr-' + s.clave + (evento ? '-' + evento : '') + '.png');
      });
    });
  }

  /* Descarga un lienzo como archivo.
     El enlace se inserta en el documento antes de pulsarlo: si no forma parte
     del DOM, varios navegadores ignoran el click y no descargan nada. */
  function descargar(lienzo, nombre) {
    lienzo.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = nombre;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
    }, 'image/png');
  }

  /* Los cuatro en UNA sola imagen, no en cuatro descargas.
     El navegador bloquea las descargas multiples seguidas y pide permiso,
     asi que "descargar todos" no llegaba a bajar nada. Una hoja unica
     ademas es lo que se manda a imprimir. */
  function descargarTodos() {
    var tarjetas = [].slice.call(document.querySelectorAll('.tarjeta'));
    if (!tarjetas.length) { decir('Primero genera los QR.'); return; }

    var evento = limpiarEvento($('#evento').value);
    var QR = 460, PAD = 40, TIT = 54, COL = 2;
    var filas = Math.ceil(tarjetas.length / COL);
    var celdaW = QR + PAD * 2;
    var celdaH = QR + TIT + PAD * 2;

    var hoja = document.createElement('canvas');
    hoja.width = celdaW * COL;
    hoja.height = celdaH * filas;
    var ctx = hoja.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, hoja.width, hoja.height);

    tarjetas.forEach(function (t, i) {
      var lienzo = t.querySelector('canvas');
      if (!lienzo) return;
      var x = (i % COL) * celdaW;
      var y = Math.floor(i / COL) * celdaH;

      ctx.fillStyle = '#251629';
      ctx.font = '600 30px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(t.querySelector('h3').textContent, x + celdaW / 2, y + PAD + 20);

      ctx.drawImage(lienzo, x + PAD, y + TIT + PAD, QR, QR);
    });

    descargar(hoja, 'qr-cloo' + (evento ? '-' + evento : '') + '.png');
  }

  $('#generar').addEventListener('click', generar);
  $('#imprimir').addEventListener('click', function () {
    if (!document.querySelector('.tarjeta')) { decir('Primero genera los QR.'); return; }
    window.print();
  });
  $('#descargar').addEventListener('click', descargarTodos);
  $('#evento').addEventListener('keydown', function (e) { if (e.key === 'Enter') generar(); });

  if (typeof QRCode === 'undefined') {
    decir('No se pudo cargar la librería de QR. Este generador necesita conexión a internet.');
    $('#generar').disabled = true;
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CLOO Latin Dance</title>
<link rel="stylesheet" href="assets/form-kit.css">
</head>
<body>

<div class="shell">

  <div class="topbar">
    <span class="brandmark">CLOO</span>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="form-wrap">

    <header class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p data-i18n="intro"></p>
      <span class="event-badge"></span>
    </header>

    <div class="form-err" role="alert"></div>

    <form class="card" novalidate>

      <div class="hp" aria-hidden="true">
        <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <div class="field">
        <label class="label" for="nombre"><span data-i18n="f_name"></span><span class="req">*</span></label>
        <input type="text" id="nombre" name="nombre" data-req autocomplete="name" data-i18n-ph="ph_name">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="email"><span data-i18n="f_email"></span><span class="req">*</span></label>
        <input type="email" id="email" name="email" data-req autocomplete="email" inputmode="email"
               autocapitalize="off" spellcheck="false" data-i18n-ph="ph_email">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="telefono"><span data-i18n="f_phone"></span><span class="req">*</span></label>
        <input type="tel" id="telefono" name="telefono" data-req autocomplete="tel" inputmode="tel"
               data-i18n-ph="ph_phone">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_who"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="destinatario" data-req>
          <button type="button" class="chip" data-value="personal" aria-pressed="false" data-i18n="who_me"></button>
          <button type="button" class="chip" data-value="pareja"   aria-pressed="false" data-i18n="who_couple"></button>
          <button type="button" class="chip" data-value="grupo"    aria-pressed="false" data-i18n="who_group"></button>
          <button type="button" class="chip" data-value="empresa"  aria-pressed="false" data-i18n="who_company"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field" data-show-when="destinatario=empresa">
        <label class="label" for="empresa"><span data-i18n="f_company"></span></label>
        <input type="text" id="empresa" name="empresa" autocomplete="organization" data-i18n-ph="ph_optional">
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_style"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="estilo" data-req>
          <button type="button" class="chip" data-value="salsa"      aria-pressed="false" data-i18n="st_salsa"></button>
          <button type="button" class="chip" data-value="bachata"    aria-pressed="false" data-i18n="st_bachata"></button>
          <button type="button" class="chip" data-value="both"       aria-pressed="false" data-i18n="st_both"></button>
          <button type="button" class="chip" data-value="choreo"     aria-pressed="false" data-i18n="st_choreo"></button>
          <button type="button" class="chip" data-value="unsure"     aria-pressed="false" data-i18n="st_unsure"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_level"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="nivel" data-req>
          <button type="button" class="chip" data-value="beginner"     aria-pressed="false" data-i18n="lv_beginner"></button>
          <button type="button" class="chip" data-value="basics"       aria-pressed="false" data-i18n="lv_basics"></button>
          <button type="button" class="chip" data-value="confident"    aria-pressed="false" data-i18n="lv_confident"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_motivation"></span><span class="req">*</span>
          <span class="hint" data-i18n="f_motivation_hint"></span>
        </label>
        <div class="chips stack" data-name="motivacion" data-req>
          <button type="button" class="chip" data-value="fun"       aria-pressed="false" data-i18n="mv_fun"></button>
          <button type="button" class="chip" data-value="social"    aria-pressed="false" data-i18n="mv_social"></button>
          <button type="button" class="chip" data-value="occasion"  aria-pressed="false" data-i18n="mv_occasion"></button>
          <button type="button" class="chip" data-value="fitness"   aria-pressed="false" data-i18n="mv_fitness"></button>
          <button type="button" class="chip" data-value="comeback"  aria-pressed="false" data-i18n="mv_comeback"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_schedule"></span>
          <span class="hint" data-i18n="f_schedule_hint"></span>
        </label>
        <div class="chips" data-name="horario">
          <button type="button" class="chip" data-value="morning"   aria-pressed="false" data-i18n="sc_morning"></button>
          <button type="button" class="chip" data-value="afternoon" aria-pressed="false" data-i18n="sc_afternoon"></button>
          <button type="button" class="chip" data-value="evening"   aria-pressed="false" data-i18n="sc_evening"></button>
          <button type="button" class="chip" data-value="weekend"   aria-pressed="false" data-i18n="sc_weekend"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_when"></span><span class="req">*</span></label>
        <div class="chips stack" data-name="cuando" data-req>
          <button type="button" class="chip" data-value="now"       aria-pressed="false" data-i18n="when_now"></button>
          <button type="button" class="chip" data-value="month"     aria-pressed="false" data-i18n="when_month"></button>
          <button type="button" class="chip" data-value="quarter"   aria-pressed="false" data-i18n="when_quarter"></button>
          <button type="button" class="chip" data-value="exploring" aria-pressed="false" data-i18n="when_exploring"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label"><span data-i18n="f_contact_pref"></span></label>
        <div class="chips" data-name="preferencia_contacto">
          <button type="button" class="chip" data-value="whatsapp" aria-pressed="false" data-i18n="cp_whatsapp"></button>
          <button type="button" class="chip" data-value="call"     aria-pressed="false" data-i18n="cp_call"></button>
          <button type="button" class="chip" data-value="email"    aria-pressed="false" data-i18n="cp_email"></button>
        </div>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="label" for="nota"><span data-i18n="f_note"></span></label>
        <textarea id="nota" name="nota" data-i18n-ph="ph_note"></textarea>
        <span class="field-err"></span>
      </div>

      <div class="field">
        <label class="consent">
          <input type="checkbox" name="consentimiento" data-req>
          <span data-i18n="consent"></span>
        </label>
        <span class="field-err"></span>
      </div>

      <div class="actions">
        <button type="submit" class="submit" data-i18n="submit"></button>
        <p class="legal" data-i18n="legal"></p>
      </div>

    </form>
  </div>

  <div class="done">
    <div class="mark"></div>
    <h2 data-i18n="done_title"></h2>
    <p data-i18n="done_text"></p>
    <div class="queued" data-i18n="queued"></div>
    <button type="button" class="again" data-i18n="again"></button>
  </div>

  <footer>CLOO · Latin Dance</footer>
</div>

window.FORM_CONFIG = {
  formId: 'latin-dance',
  servicio: 'latin-dance',
  linea: 'B2C',

</script>
<script src="assets/form-kit.js"></script>
</body>
</html>

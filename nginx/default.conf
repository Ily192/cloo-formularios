# CLOO · Formularios de captura
# Sirve los cuatro formularios y enruta /api/ al receptor de leads.
#
# Traefik (el proxy de Coolify) termina el HTTPS y entrega aquí por HTTP,
# asi que en este archivo no hay certificados: solo el puerto 80 interno.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index 01-entertainment.html;
    charset utf-8;

    # Sin esto nginx manda "text/html" a secas y el navegador tiene que
    # adivinar la codificacion; con acentos y enes eso a veces sale mal.

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- URLs limpias, una por servicio -------------------------------
    # /breathwork en vez de /02-breathwork.html. Son las que se imprimen en
    # los QR y se dictan por telefono, asi que conviene que sean cortas.
    # El ?evento= viaja solo, no hay que hacer nada.
    location ~ ^/(?:[^/]+/)*entertainment/?$ { try_files /01-entertainment.html =404; }
    location ~ ^/(?:[^/]+/)*breathwork/?$    { try_files /02-breathwork.html    =404; }
    location ~ ^/(?:[^/]+/)*latin-dance/?$   { try_files /03-latin-dance.html   =404; }
    location ~ ^/(?:[^/]+/)*performance/?$   { try_files /04-performance.html   =404; }
    location ~ ^/qr/?$            { try_files /herramientas/generador-qr.html =404; }

    # ---- Receptor de leads --------------------------------------------
    # Vive fuera del contenedor, como servicio del servidor, junto a
    # PostgreSQL. Se llega a el por la puerta de enlace de Docker.
    # Al ir por el mismo dominio, el navegador no ve una peticion cruzada
    # y no hay CORS de por medio.
    location /api/ {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # ---- Estaticos -----------------------------------------------------
    # Cache corta a proposito: un ajuste de textos debe verse el mismo dia,
    # no cuando al navegador se le ocurra.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Las rutas largas con .html siguen sirviendo: si algun QR ya salio
    # con la direccion completa, no deja de funcionar.
    location / {
        try_files $uri $uri/ =404;
    }

    # Comprobacion de vida para Coolify.
    location = /salud-web {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

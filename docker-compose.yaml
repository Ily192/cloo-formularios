# CLOO · Formularios de captura de leads
#
# Un solo contenedor: nginx sirviendo los cuatro formularios.
# Coolify lo construye desde este repositorio, le asigna el dominio y
# emite el certificado; Traefik hace de proxy por delante.
#
# Los archivos se copian dentro de la imagen (ver Dockerfile) en vez de
# montarse: en Coolify los montajes relativos no apuntan al repositorio
# clonado, y el despliegue falla al no encontrar la configuracion.
#
# El receptor de leads y PostgreSQL NO estan aqui a proposito: viven en
# el propio servidor, ya montados y con datos. El contenedor los alcanza
# por host.docker.internal, asi que no hay que migrar la base.

services:
  formularios:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # Permite que nginx llegue al receptor de leads, que corre en el
    # servidor y no en Docker. Sin esta linea, /api/ no resuelve.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    # Solo hacia dentro: quien publica al exterior es Traefik.
    expose:
      - '80'
